<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="NU certificate, transcript, MOI, name correction, verification and Apostille application support.">
<title>Tanim Computer & Digital Service Center</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&family=Source+Serif+4:wght@600;700&display=swap">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/services.css">
<script>try{var d=document.documentElement,th=localStorage.getItem("nu-desk-theme"),l=localStorage.getItem("nu-desk-lang");if(th==="dark"||th==="light")d.setAttribute("data-theme",th);if(l==="en"||l==="bn")d.lang=l;}catch(e){}</script>
</head>
<body>
<div id="siteHeader"></div>
<main id="main" data-page="contact">
<section class="page-hero"><div class="wrap">
<nav class="crumbs" aria-label="Breadcrumb"><a href="index.html" data-i18n="nav.home"></a><span aria-hidden="true">/</span><span data-i18n="nav.contact"></span></nav>
<div class="page-hero-row"><span class="badge-icon"><span class="icon" data-icon="message"></span></span>
<div><h1 data-i18n="contact.title"></h1><p class="lead" data-i18n="contact.sub"></p></div></div>
</div></section>
<section class="block"><div class="wrap wide"><div class="two">
<form class="panel" id="cForm" novalidate>
<div class="field"><label for="fName" data-i18n="f.name"></label><input id="fName" autocomplete="name"><span class="err" id="eName" role="alert"></span></div>
<div class="field"><label for="fPhone" data-i18n="f.phone"></label><input id="fPhone" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX"><span class="err" id="ePhone" role="alert"></span></div>
<div class="field"><label for="fService" data-i18n="f.service"></label><select id="fService"></select></div>
<div class="field"><label for="fCourse" data-i18n="f.course"></label><input id="fCourse" data-i18n-attr="placeholder:f.coursePh"></div>
<div class="field"><label for="fNote" data-i18n="f.note"></label><textarea id="fNote" rows="3"></textarea></div>
<label class="check"><input type="checkbox" id="fConsent"><span data-i18n="f.consent"></span></label><span class="err" id="eConsent" role="alert"></span>
<button class="btn btn-primary" type="submit"><span class="icon" data-icon="send"></span><span data-i18n="f.submit"></span></button></form>
<div style="display:grid;gap:22px;align-content:start"><div class="panel"><h2 data-i18n="msg.title"></h2><div class="out" id="out"></div></div>
<div class="panel"><h2 data-i18n="info.title"></h2><ul class="contact-list" id="infoList"></ul></div></div>
</div></div></section>
</main>
<div id="siteFooter"></div>
<script src="assets/js/config.js" defer></script>
<script src="assets/js/icons.js" defer></script>
<script src="assets/js/locales/bn.js" defer></script>
<script src="assets/js/locales/en.js" defer></script>
<script src="assets/js/core.js" defer></script>
<script src="assets/js/data.js" defer></script>
<script src="assets/js/layout.js" defer></script>
<script src="assets/js/pages/contact.js" defer></script>
</body>
</html>
